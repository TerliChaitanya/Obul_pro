<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obul Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #1b2b3a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #f0f0f0;
            padding: 2rem;
        }

        /* Animated gradient background */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Navigation styling */
        nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.2rem 2rem;
            margin-bottom: 3rem;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            padding: 1rem 2.5rem;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }

        nav a {
            color: #ffffffdd;
            text-decoration: none;
            font-weight: 500;
            font-size: 1.15rem;
            letter-spacing: 0.5px;
            padding: 0.4rem 0;
            border-bottom: 2px solid transparent;
            transition: 0.25s;
        }

        nav a:hover {
            color: #ffd966;
            border-bottom-color: #ffb347;
            transform: translateY(-3px);
        }

        /* Header / Hero section */
        header {
            text-align: center;
            max-width: 800px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            padding: 3.5rem 4rem;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 45px -10px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 1.2s ease;
        }

        h1 {
            font-size: 5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffd966, #ffb347, #ff8c42);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.4rem;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        p {
            font-size: 2rem;
            font-weight: 300;
            color: #e0e0e0;
            border-right: 3px solid #ffb347;
            display: inline-block;
            white-space: nowrap;
            overflow: hidden;
            animation: typing 3.5s steps(30, end), blink-caret 0.75s step-end infinite;
        }

        /* Paragraph typing effect */
        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes blink-caret {
            from, to { border-color: transparent; }
            50% { border-color: #ffb347; }
        }

        /* Fade in for header */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive adjustments */
        @media (max-width: 700px) {
            h1 {
                font-size: 3.5rem;
            }
            p {
                font-size: 1.5rem;
                white-space: normal;
                border-right: none;
                animation: none;
            }
            header {
                padding: 2.5rem 2rem;
            }
            nav {
                padding: 0.8rem 1.5rem;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>

<nav>
    <a href="/">Home</a>
    <a href="/profile">Profile</a>
    <a href="/skills">Skills</a>
    <a href="/projects">Projects</a>
    <a href="/softskills">Soft Skills</a>
    <a href="/hobbies">Hobbies</a>
    <a href="/contact">Contact</a>
</nav>

<header>
    <h1>Obul</h1>
    <p>Senior Software Developer</p>
</header>

<!-- The original Flask external stylesheet link is removed; internal CSS is used instead -->
</body>
</html>

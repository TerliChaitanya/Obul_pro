
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact · Obul</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #1b2b3a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #f0f0f0;
            padding: 2rem;
        }

        /* Animated gradient background */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Navigation styling (consistent with other pages) */
        nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.2rem 2rem;
            margin-bottom: 4rem;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            padding: 1rem 2.5rem;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }

        nav a {
            color: #ffffffdd;
            text-decoration: none;
            font-weight: 500;
            font-size: 1.15rem;
            letter-spacing: 0.5px;
            padding: 0.4rem 0;
            border-bottom: 2px solid transparent;
            transition: 0.25s;
        }

        nav a:hover {
            color: #ffd966;
            border-bottom-color: #ffb347;
            transform: translateY(-3px);
        }

        /* Contact section card */
        section {
            text-align: center;
            max-width: 600px;
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            padding: 3rem 2.5rem;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 45px -10px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 1s ease;
        }

        h2 {
            font-size: 3.5rem;
            font-weight: 600;
            background: linear-gradient(135deg, #ffd966, #ffb347, #ff8c42);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 2.2rem;
            letter-spacing: 1px;
        }

        /* Form styling */
        form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        input, textarea {
            width: 100%;
            padding: 1.2rem 1.8rem;
            border: none;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 180, 90, 0.3);
            color: white;
            font-size: 1.1rem;
            outline: none;
            transition: 0.2s;
        }

        input:focus, textarea:focus {
            border-color: #ffb347;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 0 4px rgba(255, 180, 90, 0.2);
        }

        input::placeholder, textarea::placeholder {
            color: rgba(255, 255, 255, 0.7);
            font-weight: 300;
        }

        textarea {
            border-radius: 30px;
            resize: vertical;
            min-height: 140px;
        }

        button {
            background: linear-gradient(135deg, #ffb347, #ff8c42);
            border: none;
            padding: 1.2rem 2rem;
            border-radius: 50px;
            font-size: 1.5rem;
            font-weight: 600;
            color: #0f2027;
            cursor: pointer;
            transition: 0.25s;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            letter-spacing: 1px;
            margin-top: 1rem;
        }

        button:hover {
            transform: scale(1.02);
            background: #ffd966;
            color: #1b2b3a;
            border-color: white;
            box-shadow: 0 15px 30px #ffb34780;
        }

        /* Fade in animation */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 600px) {
            h2 {
                font-size: 2.8rem;
            }
            section {
                padding: 2.5rem 1.5rem;
            }
            input, textarea, button {
                font-size: 1rem;
            }
            nav {
                padding: 0.8rem 1.2rem;
                gap: 0.8rem 1.5rem;
            }
        }
    </style>
</head>
<body>

<nav>
    <a href="/">Home</a>
    <a href="/profile">Profile</a>
    <a href="/skills">Skills</a>
    <a href="/projects">Projects</a>
    <a href="/softskills">Soft Skills</a>
    <a href="/hobbies">Hobbies</a>
    <a href="/contact">Contact</a>
</nav>

<section>
    <h2>Contact Me</h2>
    <form action="/submit_contact" method="POST">
        <input type="text" name="name" placeholder="Your Name" required>
        <input type="email" name="email" placeholder="Your Email" required>
        <textarea name="message" placeholder="Your Message" required></textarea>
        <button type="submit">Send</button>
    </form>
</section>

</body>
</html>
```

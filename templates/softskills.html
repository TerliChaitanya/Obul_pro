
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soft Skills · Obul</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #1b2b3a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #f0f0f0;
            padding: 2rem;
        }

        /* Animated gradient background */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Navigation styling (consistent with all portfolio pages) */
        nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.2rem 2rem;
            margin-bottom: 4rem;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            padding: 1rem 2.5rem;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }

        nav a {
            color: #ffffffdd;
            text-decoration: none;
            font-weight: 500;
            font-size: 1.15rem;
            letter-spacing: 0.5px;
            padding: 0.4rem 0;
            border-bottom: 2px solid transparent;
            transition: 0.25s;
        }

        nav a:hover {
            color: #ffd966;
            border-bottom-color: #ffb347;
            transform: translateY(-3px);
        }

        /* Soft Skills section card */
        section {
            text-align: center;
            max-width: 800px;
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            padding: 3.5rem 3rem;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 45px -10px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 1s ease;
        }

        h2 {
            font-size: 3.5rem;
            font-weight: 600;
            background: linear-gradient(135deg, #ffd966, #ffb347, #ff8c42);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 2.2rem;
            letter-spacing: 1px;
        }

        /* Soft skills tags container */
        .skills-tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.2rem;
            margin-top: 1rem;
        }

        .skills-tags span {
            background: rgba(255, 180, 90, 0.15);
            border: 1px solid #ffb347;
            backdrop-filter: blur(4px);
            padding: 0.9rem 2.2rem;
            border-radius: 50px;
            font-size: 1.7rem;
            font-weight: 400;
            color: #ffffff;
            box-shadow: 0 8px 18px rgba(0,0,0,0.25);
            transition: 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .skills-tags span:hover {
            transform: scale(1.05);
            background: #ffb347;
            color: #0f2027;
            border-color: white;
            box-shadow: 0 15px 25px #ffb34780;
        }

        /* Add representative icons (soft skills flavour) */
        .skills-tags span:nth-child(1)::before {
            content: "💬";
            font-size: 2rem;
        }
        .skills-tags span:nth-child(2)::before {
            content: "📊";
            font-size: 2rem;
        }
        .skills-tags span:nth-child(3)::before {
            content: "👥";
            font-size: 2rem;
        }
        .skills-tags span:nth-child(4)::before {
            content: "🧩";
            font-size: 2rem;
        }

        /* Fade in animation */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive adjustments */
        @media (max-width: 650px) {
            h2 {
                font-size: 2.8rem;
            }
            .skills-tags span {
                font-size: 1.4rem;
                padding: 0.7rem 1.5rem;
            }
            section {
                padding: 2.5rem 1.5rem;
            }
            nav {
                padding: 0.8rem 1.5rem;
                gap: 0.8rem 1.2rem;
            }
        }
    </style>
</head>
<body>

<nav>
    <a href="/">Home</a>
    <a href="/profile">Profile</a>
    <a href="/skills">Skills</a>
    <a href="/projects">Projects</a>
    <a href="/softskills">Soft Skills</a>
    <a href="/hobbies">Hobbies</a>
    <a href="/contact">Contact</a>
</nav>

<section>
    <h2>Soft Skills</h2>
    <div class="skills-tags">
        <span>Communication</span>
        <span>Management</span>
        <span>Leadership</span>
        <span>Problem Solving</span>
    </div>
    <!-- The original paragraph is replaced with modern tags, but the same content is present -->
</section>

</body>
</html>
